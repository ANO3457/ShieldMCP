name: Codex corpus verification
on:
  push:
    branches: [validation/codex25-shield6]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Full suite and new test lint
        run: |
          python -m pytest -q --junitxml=tests.xml
          python -m ruff check tests/unit/test_review_comment_scenario.py
          python -m ruff format --check tests/unit/test_review_comment_scenario.py
          python -m compileall -q eval/scenarios tests/unit/test_review_comment_scenario.py
      - name: Local heuristic evaluation (no model calls)
        run: |
          python eval/scenarios/attack_scenarios.py
          python eval/run_evaluation.py --framework-only --backend heuristic --output-dir validation-results
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('validation-results/framework_eval_results.json').read_text())
          assert result['metadata']['num_attack_scenarios'] == 488
          assert result['metadata']['num_benign_scenarios'] == 200
          added = [r for r in result['attack_results'] if r['scenario_id'] == 'IPI3-037']
          assert len(added) == 1 and added[0]['detected'] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-python-${{ matrix.python }}
          path: |
            tests.xml
            validation-results/framework_eval_results.json
